[package]
name = "ai-usage"
version.workspace = true
edition = "2024"

[workspace]
members = [
    ".",
    "crates/ai-usage-proto",
    "crates/ai-usage-server",
    "crates/ai-usage-updater",
]
resolver = "3"

[workspace.package]
version = "3.4.4"

[[bin]]
name = "ai-usage"
path = "src/main.rs"

[dependencies]
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
walkdir = "2"
crossterm = "0.28"
ureq = "3.2.0"
libc = "0.2"
ai-usage-proto = { path = "crates/ai-usage-proto" }
ai-usage-updater = { path = "crates/ai-usage-updater" }
ratatui = "0.29"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
ai-usage-server = { path = "crates/ai-usage-server" }
