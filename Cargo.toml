[package]
name = "vibe-usage"
version = "1.1.5"
edition = "2024"

[[bin]]
name = "vibe-usage"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
walkdir = "2"
crossterm = "0.28"
ureq = "3.2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
