name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build assets for (e.g. v1.5.9)'
        required: true

permissions:
  contents: write

jobs:
  release_notes:
    name: Publish release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH: $tag"
            exit 1
          fi
          version="$(python3 - <<'PY'
          import tomllib

          with open("Cargo.toml", "rb") as handle:
              data = tomllib.load(handle)
          print(data["workspace"]["package"]["version"])
          PY
          )"
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Release tag $tag does not match workspace version v$version"
            exit 1
          fi

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 scripts/generate_release_notes.py "$RELEASE_TAG" \
            --repository-url "$REPOSITORY_URL" > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false

  build:
    name: Build ${{ matrix.target }}
    needs: release_notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # legacy_asset / legacy_server_asset carry the former "vibe-usage" names.
      # Already-deployed binaries built before the rename look for those exact
      # asset names in releases/latest, so we keep publishing them (identical
      # bytes, second filename) until every deployment has self-updated onto the
      # renamed ai-usage binary. Drop the legacy_* fields and their staging once
      # no deployment older than the rename remains.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: ai-usage-x86_64-linux-musl
            server_asset: ai-usage-server-x86_64-linux-musl
            legacy_asset: vibe-usage-x86_64-linux-musl
            legacy_server_asset: vibe-usage-server-x86_64-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: ai-usage-aarch64-linux-musl
            server_asset: ai-usage-server-aarch64-linux-musl
            legacy_asset: vibe-usage-aarch64-linux-musl
            legacy_server_asset: vibe-usage-server-aarch64-linux-musl
            use_cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: ai-usage-x86_64-linux-gnu
            server_asset: ai-usage-server-x86_64-linux-gnu
            legacy_asset: vibe-usage-x86_64-linux-gnu
            legacy_server_asset: vibe-usage-server-x86_64-linux-gnu
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: ai-usage-aarch64-linux-gnu
            server_asset: ai-usage-server-aarch64-linux-gnu
            legacy_asset: vibe-usage-aarch64-linux-gnu
            legacy_server_asset: vibe-usage-server-aarch64-linux-gnu
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-14
            asset: ai-usage-aarch64-apple-darwin
            server_asset: ai-usage-server-aarch64-apple-darwin
            legacy_asset: vibe-usage-aarch64-apple-darwin
            legacy_server_asset: vibe-usage-server-aarch64-apple-darwin
            use_cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target dir
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross (Linux musl targets)
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build (cross)
        if: matrix.use_cross
        run: |
          cross build --release --bin ai-usage --target ${{ matrix.target }}
          cross build --release -p ai-usage-server --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: |
          cargo build --release --bin ai-usage --target ${{ matrix.target }}
          cargo build --release -p ai-usage-server --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/ai-usage"
          dest="dist/${{ matrix.asset }}"
          cp "$src" "$dest"
          chmod +x "$dest"
          server_src="target/${{ matrix.target }}/release/ai-usage-server"
          server_dest="dist/${{ matrix.server_asset }}"
          cp "$server_src" "$server_dest"
          chmod +x "$server_dest"
          # Legacy-named copies so binaries built before the rename can still
          # find their expected asset and self-update onto the renamed binary.
          legacy_dest="dist/${{ matrix.legacy_asset }}"
          cp "$src" "$legacy_dest"
          chmod +x "$legacy_dest"
          legacy_server_dest="dist/${{ matrix.legacy_server_asset }}"
          cp "$server_src" "$legacy_server_dest"
          chmod +x "$legacy_server_dest"
          ls -lh "$dest" "$server_dest" "$legacy_dest" "$legacy_server_dest"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.server_asset }}
            dist/${{ matrix.legacy_asset }}
            dist/${{ matrix.legacy_server_asset }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
