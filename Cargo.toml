[package]
name = "vibe-usage"
version = "2.0.1"
edition = "2024"

[workspace]
members = [
    ".",
    "crates/vibe-usage-proto",
    "crates/vibe-usage-server",
]
resolver = "3"

[[bin]]
name = "vibe-usage"
path = "src/main.rs"

[dependencies]
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
walkdir = "2"
crossterm = "0.28"
ureq = "3.2.0"
libc = "0.2"
vibe-usage-proto = { path = "crates/vibe-usage-proto" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
vibe-usage-server = { path = "crates/vibe-usage-server" }
