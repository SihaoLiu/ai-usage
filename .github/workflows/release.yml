name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build assets for (e.g. v1.5.9)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: vibe-usage-x86_64-linux-musl
            server_asset: vibe-usage-server-x86_64-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: vibe-usage-aarch64-linux-musl
            server_asset: vibe-usage-server-aarch64-linux-musl
            use_cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: vibe-usage-x86_64-linux-gnu
            server_asset: vibe-usage-server-x86_64-linux-gnu
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: vibe-usage-aarch64-linux-gnu
            server_asset: vibe-usage-server-aarch64-linux-gnu
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-14
            asset: vibe-usage-aarch64-apple-darwin
            server_asset: vibe-usage-server-aarch64-apple-darwin
            use_cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate release tag
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH: $tag"
            exit 1
          fi
          version="$(python3 - <<'PY'
          import tomllib

          with open("Cargo.toml", "rb") as handle:
              data = tomllib.load(handle)
          print(data["workspace"]["package"]["version"])
          PY
          )"
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Release tag $tag does not match workspace version v$version"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross (Linux musl targets)
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build (cross)
        if: matrix.use_cross
        run: |
          cross build --release --bin vibe-usage --target ${{ matrix.target }}
          cross build --release -p vibe-usage-server --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: |
          cargo build --release --bin vibe-usage --target ${{ matrix.target }}
          cargo build --release -p vibe-usage-server --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/vibe-usage"
          dest="dist/${{ matrix.asset }}"
          cp "$src" "$dest"
          chmod +x "$dest"
          server_src="target/${{ matrix.target }}/release/vibe-usage-server"
          server_dest="dist/${{ matrix.server_asset }}"
          cp "$server_src" "$server_dest"
          chmod +x "$server_dest"
          ls -lh "$dest"
          ls -lh "$server_dest"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.server_asset }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
